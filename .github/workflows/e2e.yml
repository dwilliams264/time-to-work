name: E2E Tests
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'next'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    container:
      image: mcr.microsoft.com/playwright:v1.58.1
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        id: build
        run: yarn build
      - name: Restore Allure history
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: allure-history
          path: ./.allure/
          workflow: e2e.yml
          branch: main
          if_no_artifact_found: ignore
      - name: Run tests
        id: tests
        run: yarn test:e2e
        continue-on-error: true
      - name: Generate test report
        if: always()
        run: npx allure generate --output allure-report allure-results
      - name: Debug allure output
        if: always()
        run: |
          echo "=== .allure dir ==="
          ls -la ./.allure/ || echo "not found"
      - name: Save Allure history
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: ./.allure/history.jsonl
          overwrite: true
          if-no-files-found: warn
      - name: Upload test report
        id: report
        uses: actions/upload-pages-artifact@v3
        with:
          path: './allure-report'
  # Deploy Allure Report to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.report.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: report
        uses: actions/deploy-pages@v4
