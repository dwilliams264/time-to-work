<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Soft outer halo -->
  <circle cx="64" cy="64" r="62" fill="url(#g)" opacity="0.18"/>

  <!-- Clock face — gradient filled -->
  <circle cx="64" cy="64" r="54" fill="url(#g)"/>

  <!-- Inner highlight ring -->
  <circle cx="64" cy="64" r="54" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none"/>

  <!-- Major hour ticks: 12, 3, 6, 9 -->
  <rect x="61" y="12" width="6" height="10" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="106" y="61" width="10" height="6" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="61" y="106" width="6" height="10" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="12" y="61" width="10" height="6" rx="3" fill="rgba(255,255,255,0.95)"/>

  <!-- Minor hour ticks: 1, 2, 4, 5, 7, 8, 10, 11 (rotated from 12 o'clock reference) -->
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(30 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(60 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(120 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(150 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(210 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(240 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(300 64 64)"/>
  <rect x="62" y="14" width="4" height="7" rx="2" fill="rgba(255,255,255,0.5)" transform="rotate(330 64 64)"/>

  <!-- Hour hand — 9 o'clock (left) -->
  <line x1="64" y1="64" x2="37" y2="64" stroke="white" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Minute hand — 12 o'clock (up) -->
  <line x1="64" y1="64" x2="64" y2="26" stroke="rgba(255,255,255,0.92)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center cap -->
  <circle cx="64" cy="64" r="6.5" fill="white"/>
  <circle cx="64" cy="64" r="3.5" fill="url(#g)"/>
</svg>
