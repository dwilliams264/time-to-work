<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clock circle -->
  <circle cx="64" cy="64" r="56" fill="url(#gradient)" opacity="0.15"/>
  <circle cx="64" cy="64" r="48" fill="white"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#gradient)" stroke-width="4"/>
  
  <!-- Hour markers -->
  <circle cx="64" cy="20" r="3" fill="url(#gradient)"/>
  <circle cx="64" cy="108" r="3" fill="url(#gradient)"/>
  <circle cx="108" cy="64" r="3" fill="url(#gradient)"/>
  <circle cx="20" cy="64" r="3" fill="url(#gradient)"/>
  
  <!-- Calendar page lines on left side -->
  <rect x="24" y="36" width="20" height="2" rx="1" fill="url(#gradient)" opacity="0.4"/>
  <rect x="24" y="42" width="16" height="2" rx="1" fill="url(#gradient)" opacity="0.4"/>
  <rect x="24" y="48" width="18" height="2" rx="1" fill="url(#gradient)" opacity="0.4"/>
  
  <!-- Clock hands -->
  <line x1="64" y1="64" x2="64" y2="36" stroke="url(#gradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="84" y2="64" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="5" fill="url(#gradient)"/>
</svg>
